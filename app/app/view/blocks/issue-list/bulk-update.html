<a class="btn btn-default btn-sm" data-toggle="modal" href="#" data-target="#bulk-actions">{{ @dict.bulk_update }}</a>
<div class="modal fade" id="bulk-actions" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content form-horizontal" action="{{ @BASE }}/issues/bulk_update" method="post">
            <csrf-token />
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                    <span aria-hidden="true">&times;</span><span class="sr-only">{{ @dict.close }}</span>
                </button>
                <h4 class="modal-title">{{ @dict.bulk_update }}</h4>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="bulk-status" class="col-sm-3 control-label label-sm">{{ @dict.cols.status }}</label>
                    <div class="col-sm-9">
                        <select class="form-control input-sm bulk-input" id="bulk-status" name="status">
                            <option value="">{{ @dict.choose_option }}</option>
                            <repeat group="{{ @statuses }}" value="{{ @item }}">
                                <option value="{{ @item.id }}" >{{ @item.name | esc }}</option>
                            </repeat>
                        </select>
                    </div>
                </div>
                <check if="{{ @user.role=='admin' }}">
                    <div class="form-group">
                        <label for="bulk-author" class="col-sm-3 control-label label-sm">{{ @dict.cols.author }}</label>
                        <div class="col-sm-9">
                            <select class="form-control input-sm" id="bulk-author" name="author_id">
                                <option value="">{{ @dict.choose_option }}</option>
                                <option value="{{ @user.id }}">{{ @user.name | esc }}</option>
                                <optgroup label="{{ @dict.groups }}">
                                    <repeat group="{{ @groups }}" value="{{ @group }}">
                                        <option value="{{ @group.id }}">{{ @group.name | esc }}</option>
                                    </repeat>
                                </optgroup>
                                <optgroup label="{{ @dict.users }}">
                                    <repeat group="{{ @users }}" value="{{ @item }}">
                                        <option value="{{ @item.id }}">{{ @item.name | esc }}</option>
                                    </repeat>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                </check>
                <div class="form-group">
                    <label for="bulk-owner" class="col-sm-3 control-label label-sm">{{ @dict.cols.assignee }}</label>
                    <div class="col-sm-9">
                        <select class="form-control input-sm bulk-input" id="bulk-owner" name="owner_id">
                            <option value="">{{ @dict.choose_option }}</option>
                            <option value="-1">{{ @dict.not_assigned }}</option>
                            <option value="{{ @user.id }}">{{ @user.name | esc }}</option>
                            <optgroup label="Groups">
                                <repeat group="{{ @groups }}" value="{{ @group }}">
                                    <option value="{{ @group.id }}">{{ @group.name | esc }}</option>
                                </repeat>
                            </optgroup>
                            <optgroup label="Users">
                                <repeat group="{{ @users }}" value="{{ @item }}">
                                    <option value="{{ @item.id }}">{{ @item.name | esc }}</option>
                                </repeat>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="start_date" class="col-sm-3 control-label label-sm">{{ @dict.cols.start_date }}</label>
                    <div class="col-sm-9">
                        <input class="form-control input-sm bulk-input" id="start_date" type="text" name="start_date"  value="">
                    </div>
                </div>
                <div class="form-group">
                    <label for="due_date" class="col-sm-3 control-label label-sm">{{ @dict.cols.due_date }}</label>
                    <div class="col-sm-9">
                        <input class="form-control input-sm bulk-input" id="due_date" type="text" name="due_date" value="">
                        <label class="checkbox-inline">
                            <input type="checkbox" id="bulk-due-date-sprint" name="due_date_sprint" value="1">
                            {{ @dict.set_sprint_from_due_date }}
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bulk-parent" class="col-sm-3 control-label label-sm">{{ @dict.cols.parent_id }}</label>
                    <div class="col-sm-9">
                        <input class="form-control input-sm bulk-input" type="text" id="bulk-parent" name="parent_id" value="">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bulk-priority" class="col-sm-3 control-label label-sm">{{ @dict.cols.priority }}</label>
                    <div class="col-sm-9">
                        <select class="form-control input-sm bulk-input" id="bulk-priority" name="priority">
                            <option value="">{{ @dict.choose_option }}</option>
                            <repeat group="{{ @priorities }}" value="{{ @item }}">
                                <option value="{{ @item.value }}">{{ @item.name | esc }}</option>
                            </repeat>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bulk-sprint" class="col-sm-3 control-label label-sm">{{ @dict.cols.sprint }}</label>
                    <div class="col-sm-9">
                        <select class="form-control input-sm bulk-input" id="bulk-sprint" name="sprint_id">
                            <option value="">{{ @dict.choose_option }}</option>
                            <option value="-1">{{ @dict.no_sprint }}</option>
                            <repeat group="{{ @sprints }}" value="{{ @item }}">
                                <option value="{{ @item.id }}" >{{ @item.name | esc }} {{ $this->formatShortDate(strtotime(@item.start_date)) }}-{{ $this->formatShortDate(strtotime(@item.end_date)) }}</option>
                            </repeat>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bulk-type" class="col-sm-3 control-label label-sm">{{ @dict.cols.type }}</label>
                    <div class="col-sm-9">
                        <select class="form-control input-sm bulk-input" id="bulk-type" name="type_id">
                            <option value="">{{ @dict.choose_option }}</option>
                            <repeat group="{{ @issue_types }}" value="{{ @item }}">
                                <option value="{{ @item.id }}">{{ @item.name | esc }}</option>
                            </repeat>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-9 col-sm-offset-3">
                        <div class="checkbox">
                            <label for="bulk-update-copy">
                                <input type="checkbox" id="bulk-update-copy" name="update_copy" value="1">
                                {{ @dict.update_copy }}
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="checkbox checkbox-container-inline">
                    <label for="bulk-notify">
                        <input type="checkbox" id="bulk-notify" name="notify" value="1" checked>
                        {{ @dict.send_notifications }}&nbsp;
                    </label>
                </div>
                <button type="button" class="btn btn-sm btn-default" data-dismiss="modal">{{ @dict.cancel }}</button>
                <button type="submit" id="bulk-submit" class="btn btn-sm btn-primary">{{ @dict.submit }}</button>
            </div>
            <input type="hidden" id="url_query" name="url_query" value="{{ http_build_query($_GET) | esc }}" />
        </form>
    </div>
</div>
<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function() {
    $('#bulk-submit').click(function() {
        $('#bulk-actions form :input[isacopy]').remove();
        $('.filter-form :checkbox:checked').not(':submit').clone().attr('type', 'hidden').attr('isacopy','y').appendTo('#bulk-actions form');
    });
    $('#due_date, #start_date').datepicker({
        format: 'yyyy-mm-dd',
        language: datepickerLanguage,
        orientation: 'top auto',
        clearBtn: true,
        todayHighlight: true,
        autoclose: true
    });
});
</script>
