name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        db: ["mysql", "sqlite"]
        intl: [true]
        experimental: [false]

        include:
          - php: "8.1"
            db: "sqlite"
            intl: true
            experimental: true

          - php: "8.5"
            db: "sqlite"
            intl: false
            experimental: false

          - php: "8.6"
            db: "sqlite"
            intl: true
            experimental: true

    name: PHP ${{ matrix.php }} + ${{ matrix.db }}${{ !matrix.intl && ' (no intl)' || '' }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: phproject

        ports:
          - 3306/tcp

        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ !matrix.intl && ':intl' || '' }}
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        env:
          cache-name: cache-composer

        with:
          path: ~/.composer

          key: >-
            ${{ runner.os }}-ci-${{ env.cache-name }}-${{ hashFiles('**/composer.lock') }}

          restore-keys: |
            ${{ runner.os }}-ci-${{ env.cache-name }}-
            ${{ runner.os }}-ci-
            ${{ runner.os }}-

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            -name "*.php" \
            ! -path "./vendor/*" \
            -exec php -l {} \; 2>&1 \
            | grep -q "syntax error"; then

            echo "PHP syntax error detected."
            exit 1
          fi

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

        run: >
          composer install
          --no-ansi
          --no-interaction
          --no-scripts
          --no-progress
          --prefer-dist

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: PHP CodeSniffer
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan

      - if: matrix.db == 'mysql'
        name: Install Phproject (MySQL)

        run: >
          php install.php
          --site-name=Test
          --site-url=http://localhost/
          --timezone=America/Phoenix
          --admin-username=test
          --admin-email=test@example.com
          --admin-password="Test-CI-Password-2026!"
          --db-host=127.0.0.1
          --db-port=${{ job.services.mysql.ports['3306'] }}
          --db-user=root

      - if: matrix.db == 'sqlite'
        name: Install Phproject (SQLite)

        run: >
          php install.php
          --site-name=Test
          --site-url=http://localhost/
          --timezone=America/Phoenix
          --admin-username=test
          --admin-email=test@example.com
          --admin-password="Test-CI-Password-2026!"
          --db-engine=sqlite

      - name: PHPUnit tests
        run: vendor/bin/phpunit --no-progress


  build-image:
    runs-on: ubuntu-24.04

    needs:
      - ci

    if: >
      success()
      && github.ref == 'refs/heads/master'
      && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Available platforms
        run: echo "${{ steps.buildx.outputs.platforms }}"

      - name: Run release build
        shell: bash

        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

        run: |
          set -euo pipefail

          docker run \
            --rm \
            --volume "${PWD}:/app" \
            --user "$(id -u):$(id -g)" \
            --env COMPOSER_AUTH \
            composer:2 \
            install \
            --no-ansi \
            --no-interaction \
            --no-dev \
            --no-scripts \
            --no-progress \
            --prefer-dist

          docker buildx build \
            --platform "linux/amd64,linux/arm/v7,linux/arm64" \
            --tag "docker.io/alanaktion/phproject:apache-master" \
            --tag "ghcr.io/alanaktion/phproject:apache-master" \
            --push \
            .
